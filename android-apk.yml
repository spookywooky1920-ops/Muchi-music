name: Build Muchi APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 16 platform
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        working-directory: android
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          set +e
          gradle assembleRelease --stacktrace > ../gradle-log.txt 2>&1
          code=$?
          tail -n 120 ../gradle-log.txt
          grep -E "error:|e: |FAILED|What went wrong|Execution failed|Duplicate class" ../gradle-log.txt | tail -n 50 | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ $code -ne 0 ]; then exit $code; fi
          cp app/build/outputs/apk/release/app-release.apk ../Muchi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Muchi-1.3.1
          path: Muchi.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Muchi 1.3.1
          files: Muchi.apk
          make_latest: true
          body: |
            Native Android 16 app. Media notification, lock screen, background play for Audius and radio.

            Direct link: https://github.com/Kaibshshdheueejw/Muchi-music/releases/latest/download/Muchi.apk
