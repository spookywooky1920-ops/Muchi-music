plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
// Signing keystore comes from CI secrets / environment — never from a committed file.
// - MUCHI_KEYSTORE_B64: base64 of the .p12 keystore (GitHub secret)
// - MUCHI_KEYSTORE_FILE: path to a keystore on disk (local builds / CI file)
// - MUCHI_KEYSTORE_PASSWORD: store + key password (GitHub secret)
// - MUCHI_KEY_ALIAS / MUCHI_KEY_PASSWORD: optional overrides (defaults: "muchi" / store password)
def keystoreB64 = System.getenv('MUCHI_KEYSTORE_B64') ?: ''
def keystoreFile = System.getenv('MUCHI_KEYSTORE_FILE') ?: ''
def keystorePassword = System.getenv('MUCHI_KEYSTORE_PASSWORD') ?: ''
def keyAliasName = System.getenv('MUCHI_KEY_ALIAS') ?: 'muchi'
def keyPasswordName = System.getenv('MUCHI_KEY_PASSWORD') ?: keystorePassword

android {
    namespace 'app.muchi.music'
    compileSdk 36
    defaultConfig {
        applicationId "app.muchi.music"
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "1.3.1"
        buildConfigField "String", "API_BASE", '"https://muchi-music.onrender.com"'
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${System.getenv('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
    }
    signingConfigs {
        release {
            if (keystoreB64) {
                def tmp = new File("${buildDir}/keystore/muchi-release.p12")
                tmp.parentFile.mkdirs()
                tmp.bytes = keystoreB64.decodeBase64()
                storeFile tmp
                storeType "PKCS12"
            } else if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType "PKCS12"
            }
            if (keystorePassword) {
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordName
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            // Local debug builds use the standard auto-generated debug keystore.
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}
dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:2.0.21")
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-service:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.1"
}
